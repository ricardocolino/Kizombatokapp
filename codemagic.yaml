workflows:
  android-capacitor:
    name: Android Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 21
      groups:
        - google_play
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web app
        script: |
          npm run build
      - name: Generate Assets
        script: |
          mkdir -p resources
          cat << 'EOF' > fix-resource-icon.cjs
          const fs = require('fs');
          const path = require('path');
          const iconPath = 'resources/icon.png';
          if (!fs.existsSync(iconPath) || fs.statSync(iconPath).size < 10000) {
            console.log('Detected missing or corrupt resources/icon.png. Auto-generating a premium pristine 1024x1024 template...');
            const Jimp = require('jimp');
            new Jimp(1024, 1024, 0x13111AFF, (err, image) => {
              if (err) throw err;
              const cx = 512, cy = 512, radius = 450;
              for (let y = -radius; y <= radius; y++) {
                for (let x = -radius; x <= radius; x++) {
                  if (x*x + y*y <= radius*radius) {
                    const factor = (x + y + radius*2) / (radius*4);
                    const r = Math.round(124 * (1 - factor) + 76 * factor);
                    const g = Math.round(58 * (1 - factor) + 29 * factor);
                    const b = Math.round(237 * (1 - factor) + 149 * factor);
                    image.setPixelColor((r << 24) | (g << 16) | (b << 8) | 255, cx + x, cy + y);
                  }
                }
              }
              Jimp.loadFont(Jimp.FONT_SANS_128_WHITE).then(font => {
                image.print(font, cx - Math.round(Jimp.measureText(font, 'a')/2), cy - 70, 'a');
                image.write(iconPath, () => console.log('✓ Pristine resource icon created successfully.'));
              });
            });
          } else {
            console.log('Valid local resources/icon.png found.');
          }
          EOF
          node fix-resource-icon.cjs
          rm fix-resource-icon.cjs
          npm run generate-assets
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK & AAB (Release)
        script: |
          #!/usr/bin/env bash
          cd android
          # Safety check: download a pristine, official gradle-wrapper.jar from Gradle's repository before execution
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          # Run gradle tasks to build release APK and release AAB (App Bundle)
          ./gradlew assembleRelease
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
