workflows:
  android-capacitor:
    name: Android Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: latest
      java: 21
      groups:
        - google_play

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - node_modules

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Generate Assets
        script: |
          npm run generate-assets

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Decode Keystore
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "Decoding Keystore..."
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore

            if [ -f /tmp/keystore.keystore ]; then
              echo "Keystore decoded successfully."
              ls -lh /tmp/keystore.keystore
            else
              echo "Failed to create keystore file."
              exit 1
            fi
          else
            echo "CM_KEYSTORE variable not found!"
            exit 1
          fi

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
