workflows:
  android-capacitor:
    name: Android Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: 21
      groups:
        - google_play
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web app
        script: |
          npm run build
      - name: Generate Assets
        script: |
          # Só gera se houver mudanças ou se não existirem
          npm run generate-assets
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK & AAB (Release)
        script: |
          cd android
          # Run gradle tasks to build release APK and release AAB (App Bundle)
          ./gradlew assembleRelease
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
