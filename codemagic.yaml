workflows:
  android-capacitor:
    name: Android Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      node: latest
      java: 21

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - node_modules

    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Build web app
        script: |
          npm run build

      - name: Generate Assets
        script: |
          npm run generate-assets

      - name: Sync Capacitor
        script: |
          npx cap sync android

      # ❌ SEM KEYSORE BASE64 (REMOVIDO COMPLETAMENTE)

      - name: Build Android Release (safe build)
        script: |
          cd android

          echo "Checking Gradle wrapper..."

          if [ ! -f gradlew ]; then
            echo "gradlew missing - using system gradle"
            gradle clean assembleRelease
            exit 0
          fi

          chmod +x gradlew

          echo "Trying build with wrapper..."
          ./gradlew clean assembleRelease || gradle clean assembleRelease

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/aab/**/*.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
