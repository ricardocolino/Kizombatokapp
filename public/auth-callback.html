<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angochat - Autenticando...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body style="background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; text-align: center;">
  
  <div class="loader-container">
    <div class="spinner"></div>
    <p class="status-text">A ligar à tua conta Google...</p>
    <p class="sub-text">Garante que não fechas esta janela. Faltam poucos segundos.</p>
  </div>

  <style>
    body {
      background: radial-gradient(circle at center, #18181b 0%, #000000 100%);
    }
    .loader-container {
      max-width: 320px;
      padding: 32px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }
    .spinner {
      margin: 0 auto;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(147, 51, 234, 0.1);
      border-top-color: #9333ea;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }
    .status-text {
      margin-top: 24px;
      font-weight: 600;
      font-size: 16px;
      color: #fafafa;
      letter-spacing: -0.01em;
    }
    .sub-text {
      margin-top: 8px;
      font-size: 13px;
      color: #71717a;
      line-height: 1.4;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-card {
      max-width: 340px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(239, 68, 68, 0.05);
      border: 1px solid rgba(239, 68, 68, 0.15);
      backdrop-filter: blur(10px);
    }
    .error-title {
      color: #f87171;
      font-size: 18px;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 12px;
    }
    .error-desc {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .close-btn {
      background: #fafafa;
      color: #000;
      border: 0;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: #e4e4e7;
    }
  </style>

  <script>
    const SUPABASE_URL = 'https://cxvqbhcrlpedvhvrqddx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JQPomQaK71IzMmCfGmSs2A_qPSwpxJW';

    async function handleCallback() {
      try {
        console.log(">>> [OAuth Callback] Iniciando tratamento do redirecionamento do Google...");
        
        // Inicializa o cliente na mesma origem
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Supabase trata automaticamente do PKCE lendo os parâmetros code/session do URL da janela
        const { data, error } = await client.auth.getSession();
        
        if (error) {
          console.error(">>> [OAuth Callback] Erro ao obter sessão:", error);
          throw error;
        }

        if (data.session && data.session.user) {
          const user = data.session.user;
          console.log(">>> [OAuth Callback] Utilizador identificado:", user.id, user.email);
          
          // Gerar username e name padrão
          const username = user.user_metadata?.username || user.email.split('@')[0];
          const name = user.user_metadata?.full_name || username;
          
          console.log(">>> [OAuth Callback] Sincronizando perfil no banco de dados...");
          // Upsert automático garantindo a existência do registo correspondente na BD do Supabase
          const { error: profileError } = await client
            .from('profiles')
            .upsert({
              id: user.id,
              username: username,
              name: name,
            }, { onConflict: 'id' });

          if (profileError) {
            console.error(">>> [OAuth Callback] Erro ao sincronizar o perfil:", profileError);
            // Prosseguimos mesmo assim para evitar que o utilizador fique preso
          } else {
            console.log(">>> [OAuth Callback] Perfil garantido com sucesso para:", user.id);
          }
        } else {
          console.warn(">>> [OAuth Callback] Nenhuma sessão encontrada no redirecionamento.");
          throw new Error("Não foi possível estabelecer uma sessão de autenticação com o Google.");
        }

        // Comunicar sucesso de autenticação para a janela principal (parent iframe / opener)
        if (window.opener) {
          console.log(">>> [OAuth Callback] Enviando mensagem de sucesso ao window.opener...");
          window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS' }, '*');
          
          // Pequeno delay para garantir que o postMessage foi disparado e capturado
          setTimeout(() => {
            window.close();
          }, 400);
        } else {
          console.log(">>> [OAuth Callback] Window.opener não detetado, redirecionando para o deep link do Capacitor...");
          
          const accessToken = data.session.access_token;
          const refreshToken = data.session.refresh_token;
          const deepLinkUrl = `com.kizombatok.angolavibe://oauth-callback#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}`;
          
          // Mostrar feedback visual de redirecionamento de volta para o Capacitor
          document.body.innerHTML = `
            <div class="loader-container" style="max-width: 360px; padding: 32px; border-radius: 20px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); text-align: center;">
              <div class="spinner" style="margin: 0 auto; width: 44px; height: 44px; border: 3px solid rgba(147, 51, 234, 0.1); border-top-color: #9333ea; border-radius: 50%; animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;"></div>
              <h2 style="color: #ffffff; font-size: 18px; font-weight: 800; margin-top: 24px; margin-bottom: 8px;">Autenticação Concluída!</h2>
              <p style="color: #fafafa; font-size: 13px; margin-bottom: 20px; line-height: 1.4;">A redirecionar de volta para o teu aplicativo Angochat...</p>
              <a href="${deepLinkUrl}" class="close-btn" style="background: #9333ea; color: #ffffff; text-decoration: none; display: inline-block; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease;">Entrar no Angochat</a>
              <p style="color: #71717a; font-size: 11px; margin-top: 16px;">Se o teu telemóvel não abrir a aplicação automaticamente, clica no botão roxo acima.</p>
            </div>
          `;
          
          // Redirecionamento automático por URL scheme
          window.location.href = deepLinkUrl;
        }
      } catch (err) {
        console.error(">>> [OAuth Callback] Erro crítico:", err);
        showError(err.message || 'Ocorreu um erro inesperado.');
      }
    }

    function showError(message) {
      document.body.innerHTML = `
        <div class="error-card">
          <h2 class="error-title">Falha na Autenticação</h2>
          <p class="error-desc">${message}</p>
          <button class="close-btn" onclick="window.close()">Fechar Janela</button>
        </div>
      `;
    }

    // Executa ao carregar
    window.onload = handleCallback;
  </script>
</body>
</html>
